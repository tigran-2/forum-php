services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - DB_HOST=mysql
      - DB_PASS=${DB_PASS:-root}
    volumes:
      - ./:/var/www
      - /var/www/vendor
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.3
    env_file:
      - ./.env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-forum_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      # If you want a non-root user, uncomment:
      # MYSQL_USER: ${DB_USER}
      # MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  dbdata:
